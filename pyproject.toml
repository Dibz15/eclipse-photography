[project]
name = "eclipse-photography"
version = "0.1.0"
description = "Automated eclipse photography workflow: Skyfield contact timing + gphoto2 camera control for a Nikon D5200"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "skyfield>=1.49",
    "pyyaml>=6.0",
    "scipy>=1.11",
    "tzdata>=2024.1",  # ensures zoneinfo has an IANA db on every platform
    "numpy>=1.26",
    "Pillow>=10.0",
]

[project.optional-dependencies]
# Only needed on the machine that's actually driving the camera. Requires
# libgphoto2 to be installed at the OS level first — see README.
camera = [
    "gphoto2>=2.5.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
eclipse-timings = "eclipse.timings:main"
eclipse-throughput = "eclipse.throughput_test:main"
eclipse-run = "eclipse.run_eclipse:main"
eclipse-focus-check = "eclipse.focus_check:main"
eclipse-rehearse = "eclipse.rehearse:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eclipse"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# DTZ: this project deliberately works in naive datetimes that represent
# UTC throughout (matching config.yaml's plain "HH:MM:SS" timings_utc
# fields, and rehearse.py's synthetic equivalent) rather than mixing in
# timezone-aware objects — see .clinerules.
extend-ignore = ["DTZ001", "DTZ007", "DTZ005", "DTZ003"]

[tool.pytest.ini_options]
testpaths = ["tests"]