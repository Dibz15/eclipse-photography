# Copy this to config.yaml (already done for you — config.yaml is
# gitignored so your real site coordinates don't end up in version
# control). config.yaml is the ONLY file you should need to touch
# the day before the eclipse.

location:
  latitude: 0.0        # decimal degrees, + N
  longitude: 0.0        # decimal degrees, + E
  elevation_m: 0        # helps refraction/altitude accuracy slightly

date: "2026-08-12"      # eclipse date (UTC-naive; see timezone below)
timezone: "America/Denver"

camera:
  port: null             # optional, e.g. "usb:001,005" — leave null to auto-detect
  image_quality: null    # e.g. "NEF (Raw)", "JPEG Fine" -- exact strings are
                          # camera/driver-specific. Run
                          # `uv run eclipse-throughput --list-image-quality`
                          # to see your camera's real choices, then paste one
                          # here. Leave null to not touch it (inherits whatever
                          # is already set on the camera).
  auto_free_usb_claim: false  # macOS only. If a connect fails with [-53]
                          # Could not claim the USB device, kill the system PTP
                          # daemon and retry. OFF by default and that is
                          # deliberate: launchd relaunches the daemon, which
                          # re-grabs the camera, and the resulting race left the
                          # device worse off than leaving it alone. Killing
                          # system processes automatically on the critical path
                          # of a one-shot event is not a good trade. Use
                          # `uv run eclipse-camera-check --fix` instead, which
                          # is an explicit decision you make, not one the
                          # scheduler makes for you mid-eclipse.
  capture_target: null    # normally auto-detected (whichever capturetarget
                          # choice contains "card") and enforced automatically
                          # at connect time -- unlike image_quality, there's no
                          # legitimate reason this project would want Internal
                          # RAM. Only set this if auto-detection picks the wrong
                          # choice on your camera; run
                          # `uv run eclipse-throughput --list-capture-target`
                          # to see the raw choices.
  bracket_overhead: null  # AVERAGE per-shot overhead (seconds) added to each
                          # shutter speed's own exposure time to ESTIMATE how
                          # long shots and passes take -- drives trim_to_fit()'s
                          # ladder trimming and run_bracket_once()'s per-shot
                          # "does this still fit?" check.
  bracket_timeout_margin: null  # MAX per-shot overhead + safety (seconds), used
                          # to size each shot's event_timeout -- i.e. when to give
                          # up on a shot. Deliberately a different (larger) value
                          # than bracket_overhead above: too low and slow but
                          # working exposures get recorded as failures.
                          #
                          # Both default to camera.py's DEFAULT_BRACKET_* values,
                          # measured on one specific camera/card/cable. Run
                          # `uv run eclipse-throughput --bracket-test --write`
                          # to calibrate both against your actual gear.
  download_phases: []     # phase labels whose frames should be downloaded in
                          # FULL to <output_dir>/monitor/ -- for spotting focus
                          # drift or lens fogging mid-event without the LCD
                          # (which is dark while tethered). Full files, not the
                          # camera's 160x120 preview thumbnail, which is far too
                          # small to judge focus. The card copy is untouched;
                          # this is a monitoring copy on top of it. Expect a few
                          # seconds and ~25MB per NEF, which the partial phases'
                          # 300s interval absorbs comfortably. Logged with a
                          # sharpness score where the format can be decoded
                          # (JPEG yes, NEF no -- use eclipse-focus-check for a
                          # number when shooting RAW).
                          # Sensible: ["partial_pre_totality",
                          #            "partial_post_totality"]
                          # Valid labels: partial_pre_totality,
                          #   deep_crescent_pre_totality, diamond_ring_in,
                          #   totality, diamond_ring_out,
                          #   deep_crescent_post_totality, partial_post_totality
                          # Don't add the time-critical ones (totality, either
                          # diamond ring) -- downloads cost window time.

# Hold the machine awake for the duration of a run (macOS: caffeinate).
# On by default and worth leaving on: gphoto2 calls have no timeout, so a
# USB stack torn down by a sleeping laptop can hang the process outright
# rather than raising something the reconnect logic could catch. Ignored
# for --dry-run.
prevent_sleep: true

# Spoken cues for the things you still do by hand. Times are relative to
# a contact: "C2-300" is five minutes before C2, "C3+2" two seconds after
# C3. Runs on an isolated daemon thread -- a cue failing can never affect
# capture. macOS uses the built-in `say`; espeak is used if present;
# otherwise the terminal bell.
#
# countdown_from: N speaks "N... N-1... 1" so the message lands ON the
# time, for cues that need a couple of seconds' precision. Max 10.
#
# The framing cue matters because on a fixed tripod the sun drifts ~509 px
# during a 96s totality (~400 px down, ~310 px across at 300mm). Framing
# it centred at C2 leaves it well off-centre by C3, so offset it upstream
# beforehand and let it drift through the middle.
audio_cues:
  enabled: true
  voice: null             # macOS `say` voice name, e.g. "Daniel"; null = default
  cues:
    - at: "C2-600"
      say: "Ten minutes to totality. Check focus and framing."
    - at: "C2-300"
      say: "Five minutes. Frame now so the sun sits high and upstream, about
            two hundred pixels above centre, so it drifts through the middle
            during totality."
    - at: "C2-60"
      say: "One minute. Last look through the viewfinder. Hands off the tripod."
    - at: "C2-20"
      say: "Filter off now."
      countdown_from: 5
    - at: "C2"
      say: "Totality. Look up."
    - at: "C3-15"
      say: "Fifteen seconds of totality left. Get ready to replace the filter."
    - at: "C3+8"
      say: "Filter back on now."
      countdown_from: 3

output_dir: "./eclipse_frames"

# Filled in by `uv run eclipse-focus-check --calibrate` -- see that
# script's docstring. Thresholds are relative to your specific lens/
# aperture/ROI, not universal; recalibrate if you change any of those.
#
# focus_check:
#   low_threshold: 45.2
#   high_threshold: 210.8
#   roi: null   # [x, y, width, height], or null for whole-frame

# Filled in by `uv run eclipse-timings --write`, after you've cross-checked
# the numbers against EclipseWise or the USNO calculator for your exact
# site. run_eclipse.py reads these directly — no live computation, and no
# internet dependency, on eclipse morning.
#
# timings_utc:
#   C1: "17:01:23"   # partial begins
#   C2: "18:23:47"   # totality begins (diamond ring / Baily's beads out)
#   max: "18:25:36"
#   C3: "18:27:25"   # totality ends (diamond ring / Baily's beads in)
#   C4: "19:48:02"   # partial ends